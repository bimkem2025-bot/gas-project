<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gas Project Task Tracker</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #fff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --danger: #dc2626;
        --border: #dbe3f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: var(--text);
        background: linear-gradient(135deg, #eef2ff, var(--bg));
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .container {
        width: min(760px, 92vw);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(37, 99, 235, 0.09);
      }
      .subtitle { color: var(--muted); margin-top: 0; }
      .task-form { display: flex; gap: 10px; margin-bottom: 16px; }
      input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 1rem;
      }
      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        background: #e5e7eb;
      }
      .task-form button { background: var(--primary); color: #fff; font-weight: 600; }
      .filters { display: flex; gap: 8px; margin-bottom: 12px; }
      .filters button.active { background: #dbeafe; color: #1e3a8a; }
      .task-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
      .task-item {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px;
      }
      .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }
      .icon-btn.edit { background: #fef3c7; }
      .icon-btn.delete { background: #fee2e2; color: var(--danger); }
      .empty { color: var(--muted); text-align: center; margin-top: 16px; }
      footer { margin-top: 20px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Gas Project - Task Tracker</h1>
      <p class="subtitle">Versi Google Apps Script (HtmlService)</p>

      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" placeholder="Masukkan task..." aria-label="Task input" required />
        <button type="submit">Tambah</button>
      </form>

      <section class="filters" aria-label="Task filters">
        <button data-filter="all" class="active">Semua</button>
        <button data-filter="active">Belum Selesai</button>
        <button data-filter="done">Selesai</button>
      </section>

      <ul id="taskList" class="task-list"></ul>
      <p id="emptyState" class="empty">Belum ada task.</p>

      <footer>
        <small>Data tersimpan di browser via localStorage.</small>
      </footer>
    </main>

    <script>
      const STORAGE_KEY = 'gas-project.tasks.v1';
      const taskForm = document.getElementById('taskForm');
      const taskInput = document.getElementById('taskInput');
      const taskList = document.getElementById('taskList');
      const emptyState = document.getElementById('emptyState');
      const filterButtons = document.querySelectorAll('.filters button');

      let tasks = loadTasks();
      let currentFilter = 'all';

      function loadTasks() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function applyFilter() {
        if (currentFilter === 'active') return tasks.filter((task) => !task.done);
        if (currentFilter === 'done') return tasks.filter((task) => task.done);
        return tasks;
      }

      function render() {
        const visibleTasks = applyFilter();
        taskList.innerHTML = '';

        visibleTasks.forEach((task) => {
          const item = document.createElement('li');
          item.className = `task-item ${task.done ? 'done' : ''}`;
          item.innerHTML = `
            <input type="checkbox" ${task.done ? 'checked' : ''} aria-label="toggle task" />
            <span class="task-text"></span>
            <button class="icon-btn edit" type="button">Edit</button>
            <button class="icon-btn delete" type="button">Hapus</button>
          `;

          item.querySelector('.task-text').textContent = task.text;

          item.querySelector('input').addEventListener('change', () => {
            task.done = !task.done;
            saveTasks();
            render();
          });

          item.querySelector('.edit').addEventListener('click', () => {
            const newText = prompt('Edit task:', task.text);
            if (newText === null) return;
            const trimmed = newText.trim();
            if (!trimmed) return alert('Task tidak boleh kosong.');
            task.text = trimmed;
            saveTasks();
            render();
          });

          item.querySelector('.delete').addEventListener('click', () => {
            tasks = tasks.filter((t) => t.id !== task.id);
            saveTasks();
            render();
          });

          taskList.appendChild(item);
        });

        emptyState.style.display = visibleTasks.length ? 'none' : 'block';
      }

      taskForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const text = taskInput.value.trim();
        if (!text) return;

        tasks.unshift({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          text,
          done: false
        });

        taskInput.value = '';
        saveTasks();
        render();
      });

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          filterButtons.forEach((b) => b.classList.remove('active'));
          button.classList.add('active');
          render();
        });
      });

      render();
    </script>
  </body>
</html>
